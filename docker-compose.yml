services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      AIMFS_ENV: development
      AIMFS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AIMFS_MAX_UPLOAD_MB: 20
      AIMFS_MAX_IMAGE_PIXELS: 20000000

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
